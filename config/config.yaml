# IPCon v.1 Configuration
# Professional IP Rotation System

rotation:
  interval: 60
  strategy: round_robin
  pre_connect: true
  pre_connect_time: 5.0
  max_retries: 3
  retry_delay: 2.0
  fail_threshold: 3
  health_check_interval: 30

security:
  kill_switch: true
  dns_leak_protection: true
  ipv6_leak_protection: true
  allowed_ports: [53, 67, 68]

network:
  dns_servers: [1.1.1.1, 1.0.0.1]
  vpn_interface: tun+
  mtu: 1400

logging:
  level: INFO
  file: logs/ipcon.log
  max_size: 10MB
  backup_count: 5

providers:
  - name: "Tor Network"
    type: "tor"
    enabled: true
    port: 9051
    socks_port: 9050
    auto_renew: true
    renew_interval: 30
